version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: marketpulse-db
    environment:
      POSTGRES_DB: marketpulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - marketpulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  marketpulse_pgdata:
    driver: local
